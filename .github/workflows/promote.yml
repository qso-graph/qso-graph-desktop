# SPDX-License-Identifier: GPL-3.0-only
# Promote a proven pre-release to a full release (docs/RELEASES.md): the same
# release, its same files, marked a release and Latest. Nothing is rebuilt or
# renamed, so what was tested is what ships. Run by hand, when KI7MT says so:
# Actions → Promote → Run workflow, with the version. Then the update feed
# names it on the Stable track (feed.yml), and the apt and dnf repositories
# offer it (linux-repos.yml, #113). A run that stopped after the release was
# marked Latest is finished by running Promote again: the feed and the
# repositories are rebuilt from the releases, so both repeat safely.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The pre-release to promote, such as 0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: promote v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read  # whether the feed can be published (#106)
    steps:
      # The feed can be published (#106), checked before anything changes: Promote
      # made the release Stable and Latest first and ran the feed after, so with
      # Pages off it left GitHub saying Stable while installed copies' feed still
      # said none. Release has had this check since #99.
      - name: The update feed can be published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pages=$(gh api "repos/${REPO}/pages" --jq '"\(.build_type) \(.cname // "")"' 2>/dev/null) || pages=""
          if [ "$pages" = "workflow updates.qso-graph.io" ]; then
            echo "✓ the update feed can be published (Pages, from Actions, at updates.qso-graph.io)"
          else
            echo "Not promoted: the update feed cannot be published. This repository's Pages must be on, built from GitHub Actions, at updates.qso-graph.io (it is: ${pages:-off})." >&2
            exit 1
          fi
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Checked before it is used in anything: a release version, nothing else.
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Give a release version, such as 0.1.0." >&2
            exit 1
          fi
          tag="v${VERSION}"
          state=$(gh release view "$tag" --repo "$REPO" --json isPrerelease,assets \
            -q '"\(.isPrerelease) \([.assets[].name] | index("SHA256SUMS.txt") != null)"')
          # Which release GitHub marks Latest: a full release that is, was
          # promoted and stopped before the feed or the repositories (#118's
          # shape), and is finished from here.
          latest=$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)
          promoted=false
          case "$state" in
            "true true") ;;
            "false true")
              [ "$latest" = "$tag" ] || { echo "$tag is a full release, and not the Latest (${latest:-none}): not promoting it again." >&2; exit 1; }
              promoted=true
              echo "$tag is already promoted and Latest: finishing the feed and the repositories." ;;
            "false "*) echo "$tag is already a full release." >&2; exit 1 ;;
            *) echo "$tag has no SHA256SUMS.txt: it is not a release this repository built." >&2; exit 1 ;;
          esac
          # The tag's commit is on main, or on its own fix branch (0.2.x for
          # 0.2.1): only what the Release workflow built is promoted.
          commit=$(gh api "repos/${REPO}/commits/${tag}" -q .sha)
          fix="${VERSION%.*}.x"
          on() { gh api "repos/${REPO}/compare/$1...${commit}" -q .status 2>/dev/null | grep -qx -e identical -e behind; }
          on main || on "$fix" || {
            echo "$tag is not a commit on main or ${fix}." >&2
            exit 1
          }
          [ "$promoted" = true ] || gh release edit "$tag" --repo "$REPO" --prerelease=false --latest
          gh release view "$tag" --repo "$REPO" --json tagName,isPrerelease -q '"\(.tagName) pre-release=\(.isPrerelease)"'

  feed:
    name: update feed
    needs: [promote]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml

  linux-repos:
    name: apt and dnf repositories
    needs: [promote]
    permissions:
      contents: read
    uses: ./.github/workflows/linux-repos.yml
    secrets: inherit
