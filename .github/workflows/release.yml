# SPDX-License-Identifier: GPL-3.0-only
# Release (#94, #157, docs/RELEASES.md): the only way anything is published.
# Run by hand when KI7MT says so: Actions → Release → Run workflow, from main
# (or a released version's fix branch, 0.2.x), with the version main says.
# Merging into main builds nothing and publishes nothing: the pull request's
# run was the check and the build (KI7MT, 2026-11-02).
#
# Two kinds (KI7MT, 2026-11-01): a Beta, MAJOR.MINOR.PATCH-beta.N, published
# as a pre-release and offered on the Beta track; or a Release,
# MAJOR.MINOR.PATCH, published as Latest and offered to everyone. A Release
# also closes its milestone and rebuilds apt and dnf (packages.yml), which
# Promote did until #157: there is no promoting now. A Beta becomes a Release
# by a pull request setting main's version to the release, and a Release run.
#
# Nothing is rebuilt here. What is published is the signed build CI made in
# the pull request that brought main its version, passed as ci-all-green, and
# only once it is proved to be of exactly the files main holds: the same git
# tree, which is a hash of every file. So what was tested is what ships, and a
# change is built and signed once. Before anything is published it refuses
# unless every check holds: run from main, main says this version,
# CHANGELOG.md is ready for it (a Release's own section, or for a Beta
# something under [Unreleased]), it is new or was begun from this same build
# (#118), its milestone exists, and a release candidate's all-green build of
# main's files packaged every platform, with nothing but documentation since. A run that failed after it was published is finished
# by running Release again: it uploads only the files it lacks, and the
# milestone, feed and package steps repeat safely.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, such as 0.6.0-beta.1 or 0.6.0: main must already say it'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: ready to release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # CI's run of this commit, the milestone, and Pages (#99).
      actions: read
      issues: read
      pages: read
    outputs:
      run: ${{ steps.ready.outputs.run }}
      sha: ${{ steps.ready.outputs.sha }}
      milestone: ${{ steps.ready.outputs.milestone }}
      mode: ${{ steps.ready.outputs.mode }}
      # beta or release (#157).
      kind: ${{ steps.ready.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          problems=0
          fail() { echo "✗ $1" >&2; problems=$((problems + 1)); }
          # Checked before it is used in anything: a Release or a Beta version, nothing else.
          if [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            kind=release
          elif [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.[1-9][0-9]{0,2}$ ]]; then
            kind=beta
          else
            echo "✗ Give a Release version, such as 0.6.0, or a Beta, such as 0.6.0-beta.1." >&2; exit 1
          fi
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          # The milestone is the release's: a Beta of 0.6.0 is in milestone 0.6.0.
          target=${VERSION%%-*}
          # Only main, or a released version's fix branch (x.y.x, docs/RELEASES.md),
          # is released: Run workflow can be pointed at any branch.
          branch=${GITHUB_REF#refs/heads/}
          if [ "$GITHUB_REF" != refs/heads/main ] && ! [[ "$GITHUB_REF" =~ ^refs/heads/[0-9]+\.[0-9]+\.x$ ]]; then
            echo "✗ Releases are made from main or a fix branch such as 0.2.x; this run is on ${GITHUB_REF}." >&2; exit 1
          fi
          echo "Releasing ${VERSION} from ${branch} at ${GITHUB_SHA}."
          have=$(node -p "require('./package.json').version")
          [ "$have" = "$VERSION" ] && echo "✓ ${branch} says ${VERSION}" || fail "${branch} says ${have}, not ${VERSION}"
          node scripts/release.mjs check && echo "✓ CHANGELOG.md is ready for ${VERSION}" || fail "CHANGELOG.md is not ready (above)"
          milestone=$(gh api --paginate "repos/${REPO}/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"${target}\") | \"\(.number) \(.open_issues) \(.state)\"")
          if [ -z "$milestone" ]; then
            fail "there is no milestone ${target}"
          else
            read -r number _ _ <<< "$milestone"
            # Its issues do not gate a release (KI7MT, 2026-10-30): a milestone can hold any number,
            # deferred or won't-fix among them.
            echo "✓ milestone ${target}"
            echo "milestone=${number}" >> "$GITHUB_OUTPUT"
          fi
          # The build to publish: a release candidate's pull request build
          # (ci.yml's plan: signed, and stamped with this very version, not
          # -prN) that passed ci-all-green and packaged all four platforms, of
          # exactly the files a commit of main holds. A merge builds nothing,
          # so the build is the pull request's: its commit's git tree, the hash
          # of every file in it, must be that main commit's tree. A pull request
          # behind main when it merged has a different tree, and is refused:
          # what it built is not what main holds. A documentation-only merge
          # since builds nothing (#95), so the commit matched may be an earlier
          # one; it is taken only if every change after it is documentation,
          # which never touches package.json, CHANGELOG.md or the spec (found by
          # Codex, #94). The release is tagged on that main commit.
          built="" run="" best=""
          # main's newest commits, with their trees, newest first.
          gh api "repos/${REPO}/commits?sha=${GITHUB_SHA}&per_page=50" --jq '.[] | "\(.sha) \(.commit.tree.sha)"' > "$RUNNER_TEMP/main-trees"
          for candidate in $(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=50" \
              --jq ".workflow_runs[] | select(.head_repository.full_name == \"${REPO}\") | \"\(.id):\(.head_sha)\""); do
            id=${candidate%%:*}; head=${candidate#*:}
            tree=$(gh api "repos/${REPO}/git/commits/${head}" --jq .tree.sha)
            # The newest main commit holding exactly these files, by its place in the list.
            at=$(awk -v t="$tree" '$2 == t { print NR " " $1; exit }' "$RUNNER_TEMP/main-trees")
            [ -n "$at" ] || continue
            [ -z "$best" ] || [ "${at%% *}" -lt "$best" ] || continue
            # Every attempt, the latest result per job: after "re-run failed
            # jobs" the default list holds only the re-run (found by Codex).
            jobs=$(gh api "repos/${REPO}/actions/runs/${id}/jobs?filter=all&per_page=100" --paginate \
              --jq '.jobs[]' | jq -s '[group_by(.name)[] | max_by(.run_attempt) | select(.conclusion == "success") | .name] | map(select(. == "ci-all-green" or startswith("package ("))) | length')
            [ "$jobs" = 5 ] || continue
            # Stamped with this version: the pull request build's own download of
            # the Windows installer is named for it (a name kept after its 14 days;
            # the platforms' files, which are published, are kept 90). A build stamped -prN is not
            # a release candidate, was not signed as one and has no provenance.
            named=$(gh api "repos/${REPO}/actions/runs/${id}/artifacts?per_page=100" --paginate \
              --jq ".artifacts[] | select(.name == \"qso-graph-desktop-${VERSION}-win-x64.exe\") | .name" | head -n1)
            [ -n "$named" ] || continue
            best=${at%% *}; built=${at#* }; run=$id
            echo "  run ${id}: the build of ${head::7}, the same files as main's ${built::7}"
            [ "$best" = 1 ] && break
          done
          if [ -z "$run" ]; then
            fail "no release candidate's pull request build of ${VERSION} is of the files main holds: the pull request setting ${VERSION} must be built from a milestone's (feature/x.y.z) or a fix's branch, up to date with main, and green"
          elif [ "$built" = "$GITHUB_SHA" ]; then
            echo "✓ CI is all green and packaged ${GITHUB_SHA} (run ${run})"
          else
            # At most 300 files are listed; a list that may be partial is not
            # documentation-only (Codex, #94).
            gh api "repos/${REPO}/compare/${built}...${GITHUB_SHA}" > "$RUNNER_TEMP/compare.json"
            after=""
            [ "$(jq '.files | length' "$RUNNER_TEMP/compare.json")" -lt 300 ] \
              && after=$(jq -r '.files[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/compare.json")
            if [ "$(printf '%s\n' "$after" | node scripts/docs-only.mjs)" = true ]; then
              echo "✓ CI is all green and packaged ${built} (run ${run}); since then, documentation only"
            else
              fail "the newest release candidate's build is of ${built}, and ${branch} has changed since by more than documentation: a pull request's build of what ${branch} holds now is needed"
            fi
          fi
          # Where the release stands (#118): new, or begun and to be finished. A
          # failure past publishing left the tag and the release, perhaps with some
          # of its files, and a re-run used to refuse "already tagged". The tag's
          # commit (a lightweight tag's own, an annotated tag's ^{}), and the
          # release: only GitHub's "release not found" is none, and any other error
          # stops here, so an answer that never came is not read as nothing there.
          mode=""
          if [ -n "$built" ]; then
            tags=$(git ls-remote --tags "https://github.com/${REPO}.git" "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}")
            tag_commit=$(awk -v t="refs/tags/v${VERSION}^{}" '$2 == t { print $1 }' <<< "$tags")
            [ -n "$tag_commit" ] || tag_commit=$(awk -v t="refs/tags/v${VERSION}" '$2 == t { print $1 }' <<< "$tags")
            if gh release view "v${VERSION}" --repo "$REPO" --json tagName,isDraft > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
              release_file="$RUNNER_TEMP/release.json"
            elif grep -q 'release not found' "$RUNNER_TEMP/release.err"; then
              release_file=-
            else
              cat "$RUNNER_TEMP/release.err" >&2; echo "✗ GitHub could not say whether v${VERSION} is released." >&2; exit 1
            fi
            if state=$(node scripts/release.mjs state "$VERSION" "$built" "${tag_commit:--}" "$release_file"); then
              mode=${state#state=}
              if [ "$mode" = new ]; then echo "✓ v${VERSION} is free"; else echo "✓ v${VERSION} is released on ${built}, and is finished from where it stopped"; fi
            else
              fail "v${VERSION} cannot be released or finished (above)"
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "sha=${built}" >> "$GITHUB_OUTPUT"
          # The feed can be published (#99): releasing 0.2.1 published every
          # file, then failed at the feed because Pages was off, so installed
          # copies were still offered 0.2.0. Pages must be on, built by
          # Actions, and serving the feed's own address, before anything goes.
          pages=$(gh api "repos/${REPO}/pages" --jq '"\(.build_type) \(.cname // "")"' 2>/dev/null) || pages=""
          if [ "$pages" = "workflow updates.qso-graph.io" ]; then
            echo "✓ the update feed can be published (Pages, from Actions, at updates.qso-graph.io)"
          else
            fail "the update feed cannot be published: this repository's Pages must be on, built from GitHub Actions, at updates.qso-graph.io (it is: ${pages:-off})"
          fi
          if [ "$problems" -gt 0 ]; then echo "Not released: ${problems} check(s) failed." >&2; exit 1; fi

  publish:
    name: publish v${{ inputs.version }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The release and its tag; the files of CI's run; closing the milestone;
      # reading the installers' provenance and attesting SHA256SUMS.txt (#83).
      contents: write
      actions: read
      issues: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The installers CI built and signed, from the pull request's run the
      # checks proved to be of main's files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.checks.outputs.run }}
          github-token: ${{ github.token }}
          pattern: qso-graph-desktop-*
          path: release
          merge-multiple: true
      # Every installer carries CI's provenance for this repository before
      # anything is published (#83): a file without it is not one CI built here.
      - name: Provenance verifies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for file in release/*; do
            gh attestation verify "$file" -R "$REPO" --signer-workflow "${REPO}/.github/workflows/ci.yml" >/dev/null
            echo "✓ $(basename "$file")"
          done
      - name: SHA256SUMS.txt
        run: (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # SHA256SUMS.txt is made here, so its provenance is this workflow's.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS.txt
      - name: Publish the Beta or the Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          BUILT: ${{ needs.checks.outputs.sha }}
          MODE: ${{ needs.checks.outputs.mode }}
          KIND: ${{ needs.checks.outputs.kind }}
          CI_RUN: ${{ needs.checks.outputs.run }}
        run: |
          set -euo pipefail
          # Every file carries this version: nothing from another build rides along.
          cd release
          for file in *; do
            case "$file" in
              "qso-graph-desktop-${VERSION}-"*|SHA256SUMS.txt) ;;
              *) echo "$file is not a ${VERSION} file" >&2; exit 1 ;;
            esac
          done
          ls -la
          cd ..
          # The CI run these files came from, the one the checks chose, for
          # one line saying its checks passed on every platform rather than a
          # list of every test (KI7MT, 2026-10-29). CI runs the fast suites and
          # the window and package ones; the rest run before a sign-off
          # (make verify), so the line says CI's checks, and no more.
          ci_run=""
          if [[ "${CI_RUN:-}" =~ ^[0-9]+$ ]]; then ci_run="https://github.com/${REPO}/actions/runs/${CI_RUN}"; fi
          {
            # Quick downloads first: the file for each computer (after WSJT-X's pages).
            node scripts/release.mjs downloads "$VERSION" release
            echo
            echo "---"
            echo
            node scripts/release.mjs notes "$VERSION"
            echo
            echo "---"
            echo
            if [ -n "$ci_run" ]; then
              echo "**Tested:** CI's checks passed on Windows, Linux x64, Linux arm64 and macOS, in [the build these files came from](${ci_run})."
              echo
            fi
            if [ "$KIND" = beta ]; then
              echo "**A Beta** of ${VERSION%%-*}, before it is final: offered in the app to those who choose Beta in Settings, and carries no guarantee. Not offered by the Microsoft Store, apt, dnf or Homebrew, which take Releases only."
            else
              echo "**A Release**: offered in the app, by the Microsoft Store, apt and dnf, and Homebrew."
            fi
            echo "Signed by KI7MT: Windows as **Gregory Beam**, macOS as **Greg Beam** (Apple Developer ID) and notarized by Apple."
            echo
            echo "A **.zip** is the portable build: unpack it anywhere and run it, nothing to install."
            echo "Check a download against **SHA256SUMS.txt**. Every file here was built by this repository's CI, and GitHub signs that it was: \`gh attestation verify <file> -R qso-graph/qso-graph-desktop\` ([how to verify a download](https://github.com/qso-graph/qso-graph-desktop#verify-your-download))."
          } > notes.md
          if [ "$MODE" = new ]; then
            # Refuses if the tag exists, so nothing is published twice. A Beta
            # is a pre-release; a Release is a release, and Latest.
            if [ "$KIND" = beta ]; then kind=(--prerelease); title="QSO Graph Desktop ${VERSION} (Beta)"; else kind=(--latest); title="QSO Graph Desktop ${VERSION}"; fi
            (cd release && gh release create "v${VERSION}" --repo "$REPO" "${kind[@]}" --target "$BUILT" \
              --title "$title" --notes-file ../notes.md -- *)
          else
            # Begun and stopped (#118): the files it lacks, and nothing replaced. A
            # file on it that is not this build's stops the run (release.mjs resume).
            mkdir -p "$RUNNER_TEMP/present"
            # A release that stopped before its first file has none: gh says
            # "no assets to download" for that, and only that is taken as empty.
            if ! gh release download "v${VERSION}" --repo "$REPO" --dir "$RUNNER_TEMP/present" 2> "$RUNNER_TEMP/download.err"; then
              grep -qx 'no assets to download' "$RUNNER_TEMP/download.err" || { cat "$RUNNER_TEMP/download.err" >&2; exit 1; }
            fi
            (cd release && sha256sum -- *) > "$RUNNER_TEMP/expected.sums"
            (cd "$RUNNER_TEMP/present" && { sha256sum -- * 2>/dev/null || true; }) > "$RUNNER_TEMP/present.sums"
            missing=$(node scripts/release.mjs resume "$RUNNER_TEMP/expected.sums" "$RUNNER_TEMP/present.sums")
            if [ -n "$missing" ]; then
              echo "Uploading what v${VERSION} lacks:"; echo "$missing"
              mapfile -t files <<< "$missing"
              (cd release && gh release upload "v${VERSION}" --repo "$REPO" -- "${files[@]}")
            else
              echo "v${VERSION} has every file already."
            fi
          fi
          gh release view "v${VERSION}" --repo "$REPO" --json tagName,isPrerelease,assets \
            -q '"\(.tagName) pre-release=\(.isPrerelease), \(.assets | length) files"'
      # A Release finishes its milestone; a Beta leaves it open. Safe to repeat:
      # closing a closed milestone changes nothing.
      - name: Close the milestone
        if: needs.checks.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MILESTONE: ${{ needs.checks.outputs.milestone }}
        run: |
          gh api -X PATCH "repos/${REPO}/milestones/${MILESTONE}" -f state=closed --jq '"milestone \(.title): \(.state)"'

  feed:
    name: update feed
    needs: [publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml
    secrets:
      LINUX_PACKAGE_SIGNING_KEY_PRIVATE: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PRIVATE }}
      LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE }}

  # A Release only (#157): apt and dnf, and the Windows installer at its
  # versioned address for the Microsoft Store, all of which take Releases only.
  # Promote did this until 0.6.0. Homebrew's cask is bumped after it, by
  # KI7MT's qg-release (qso-graph-devel), Releases only.
  packages:
    name: packages.qso-graph.net
    needs: [checks, publish]
    if: needs.checks.outputs.kind == 'release'
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    secrets: inherit
