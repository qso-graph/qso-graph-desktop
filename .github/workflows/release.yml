# SPDX-License-Identifier: GPL-3.0-only
# Release (#94, docs/RELEASES.md): the only way anything is published. Run by
# hand when KI7MT says so: Actions → Release → Run workflow, from main (or a
# released version's fix branch, 0.2.x), with the version. Merging into main builds, tests and signs; it publishes
# nothing.
#
# Nothing is rebuilt here. The release is the signed build CI already made
# of main's commit and passed as ci-all-green, so what was tested is what
# ships. Before anything is published it refuses unless every check holds:
# run from main, main says this version, CHANGELOG.md has its section, it is
# new or was begun from this same build (#118), its milestone has no open issue, and CI's newest all-green
# build of main packaged every platform, with nothing but documentation
# since. Then the pre-release vx.y.z (tagging the commit built), the
# milestone closed, and the Early update feed. A run that failed after the
# release was made is finished by running Release again: it uploads only the
# files the release lacks, and the milestone and feed steps repeat safely. Promoting it to Stable is
# promote.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, such as 0.2.1: main must already say it'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: ready to release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # CI's run of this commit, the milestone's open issues, and Pages (#99).
      actions: read
      issues: read
      pages: read
    outputs:
      run: ${{ steps.ready.outputs.run }}
      sha: ${{ steps.ready.outputs.sha }}
      milestone: ${{ steps.ready.outputs.milestone }}
      mode: ${{ steps.ready.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          problems=0
          fail() { echo "✗ $1" >&2; problems=$((problems + 1)); }
          # Checked before it is used in anything: a release version, nothing else.
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "✗ Give a release version, such as 0.2.1." >&2; exit 1
          fi
          # Only main, or a released version's fix branch (x.y.x, docs/RELEASES.md),
          # is released: Run workflow can be pointed at any branch.
          branch=${GITHUB_REF#refs/heads/}
          if [ "$GITHUB_REF" != refs/heads/main ] && ! [[ "$GITHUB_REF" =~ ^refs/heads/[0-9]+\.[0-9]+\.x$ ]]; then
            echo "✗ Releases are made from main or a fix branch such as 0.2.x; this run is on ${GITHUB_REF}." >&2; exit 1
          fi
          echo "Releasing ${VERSION} from ${branch} at ${GITHUB_SHA}."
          have=$(node -p "require('./package.json').version")
          [ "$have" = "$VERSION" ] && echo "✓ ${branch} says ${VERSION}" || fail "${branch} says ${have}, not ${VERSION}"
          node scripts/release.mjs check && echo "✓ CHANGELOG.md has its ${VERSION} section" || fail "CHANGELOG.md is not ready (above)"
          milestone=$(gh api --paginate "repos/${REPO}/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"${VERSION}\") | \"\(.number) \(.open_issues) \(.state)\"")
          if [ -z "$milestone" ]; then
            fail "there is no milestone ${VERSION}"
          else
            read -r number open state <<< "$milestone"
            [ "$open" = 0 ] && echo "✓ milestone ${VERSION} has no open issue" || fail "milestone ${VERSION} has ${open} open issue(s)"
            echo "milestone=${number}" >> "$GITHUB_OUTPUT"
          fi
          # The build to publish: CI's newest run on this branch that passed ci-all-green
          # and packaged all four platforms. A documentation-only merge since
          # builds nothing (#95), so that run may be of an earlier commit; it
          # is taken only if every change after it is documentation, which
          # never touches package.json, CHANGELOG.md or the spec (found by
          # Codex, #94). The release is tagged on the commit that was built.
          built="" run=""
          for candidate in $(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?event=push&branch=${branch}&status=success&per_page=30" \
              --jq '.workflow_runs[] | "\(.id):\(.head_sha)"'); do
            # Every attempt, the latest result per job: after "re-run failed
            # jobs" the default list holds only the re-run (found by Codex).
            jobs=$(gh api "repos/${REPO}/actions/runs/${candidate%%:*}/jobs?filter=all&per_page=100" --paginate \
              --jq '.jobs[]' | jq -s '[group_by(.name)[] | max_by(.run_attempt) | select(.conclusion == "success") | .name] | map(select(. == "ci-all-green" or startswith("package ("))) | length')
            if [ "$jobs" = 5 ]; then run=${candidate%%:*}; built=${candidate#*:}; break; fi
          done
          if [ -z "$run" ]; then
            fail "CI has no all-green run on ${branch} that packaged every platform"
          elif [ "$built" = "$GITHUB_SHA" ]; then
            echo "✓ CI is all green and packaged ${GITHUB_SHA} (run ${run})"
          else
            # At most 300 files are listed; a list that may be partial is not
            # documentation-only (Codex, #94).
            gh api "repos/${REPO}/compare/${built}...${GITHUB_SHA}" > "$RUNNER_TEMP/compare.json"
            after=""
            [ "$(jq '.files | length' "$RUNNER_TEMP/compare.json")" -lt 300 ] \
              && after=$(jq -r '.files[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/compare.json")
            if [ "$(printf '%s\n' "$after" | node scripts/docs-only.mjs)" = true ]; then
              echo "✓ CI is all green and packaged ${built} (run ${run}); since then, documentation only"
            else
              fail "CI's newest packaged build is ${built}, and ${branch} has changed since: wait for CI's run of ${GITHUB_SHA}"
            fi
          fi
          # Where the release stands (#118): new, or begun and to be finished. A
          # failure past publishing left the tag and the release, perhaps with some
          # of its files, and a re-run used to refuse "already tagged". The tag's
          # commit (a lightweight tag's own, an annotated tag's ^{}), and the
          # release: only GitHub's "release not found" is none, and any other error
          # stops here, so an answer that never came is not read as nothing there.
          mode=""
          if [ -n "$built" ]; then
            tags=$(git ls-remote --tags "https://github.com/${REPO}.git" "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}")
            tag_commit=$(awk -v t="refs/tags/v${VERSION}^{}" '$2 == t { print $1 }' <<< "$tags")
            [ -n "$tag_commit" ] || tag_commit=$(awk -v t="refs/tags/v${VERSION}" '$2 == t { print $1 }' <<< "$tags")
            if gh release view "v${VERSION}" --repo "$REPO" --json tagName,isDraft > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
              release_file="$RUNNER_TEMP/release.json"
            elif grep -q 'release not found' "$RUNNER_TEMP/release.err"; then
              release_file=-
            else
              cat "$RUNNER_TEMP/release.err" >&2; echo "✗ GitHub could not say whether v${VERSION} is released." >&2; exit 1
            fi
            if state=$(node scripts/release.mjs state "$VERSION" "$built" "${tag_commit:--}" "$release_file"); then
              mode=${state#state=}
              if [ "$mode" = new ]; then echo "✓ v${VERSION} is free"; else echo "✓ v${VERSION} is released on ${built}, and is finished from where it stopped"; fi
            else
              fail "v${VERSION} cannot be released or finished (above)"
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "sha=${built}" >> "$GITHUB_OUTPUT"
          # The feed can be published (#99): releasing 0.2.1 published every
          # file, then failed at the feed because Pages was off, so installed
          # copies were still offered 0.2.0. Pages must be on, built by
          # Actions, and serving the feed's own address, before anything goes.
          pages=$(gh api "repos/${REPO}/pages" --jq '"\(.build_type) \(.cname // "")"' 2>/dev/null) || pages=""
          if [ "$pages" = "workflow updates.qso-graph.io" ]; then
            echo "✓ the update feed can be published (Pages, from Actions, at updates.qso-graph.io)"
          else
            fail "the update feed cannot be published: this repository's Pages must be on, built from GitHub Actions, at updates.qso-graph.io (it is: ${pages:-off})"
          fi
          if [ "$problems" -gt 0 ]; then echo "Not released: ${problems} check(s) failed." >&2; exit 1; fi

  publish:
    name: publish v${{ inputs.version }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The release and its tag; the files of CI's run; closing the milestone;
      # reading the installers' provenance and attesting SHA256SUMS.txt (#83).
      contents: write
      actions: read
      issues: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The installers CI built and signed, from its own run of this commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.checks.outputs.run }}
          github-token: ${{ github.token }}
          pattern: qso-graph-desktop-*
          path: release
          merge-multiple: true
      # Every installer carries CI's provenance for this repository before
      # anything is published (#83): a file without it is not one CI built here.
      - name: Provenance verifies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for file in release/*; do
            gh attestation verify "$file" -R "$REPO" --signer-workflow "${REPO}/.github/workflows/ci.yml" >/dev/null
            echo "✓ $(basename "$file")"
          done
      - name: SHA256SUMS.txt
        run: (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # SHA256SUMS.txt is made here, so its provenance is this workflow's.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS.txt
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          BUILT: ${{ needs.checks.outputs.sha }}
          MODE: ${{ needs.checks.outputs.mode }}
          CI_RUN: ${{ needs.checks.outputs.run }}
        run: |
          set -euo pipefail
          # Every file carries this version: nothing from another build rides along.
          cd release
          for file in *; do
            case "$file" in
              "qso-graph-desktop-${VERSION}-"*|SHA256SUMS.txt) ;;
              *) echo "$file is not a ${VERSION} file" >&2; exit 1 ;;
            esac
          done
          ls -la
          cd ..
          # The CI run these files came from, the one the checks chose, for
          # one line saying its checks passed on every platform rather than a
          # list of every test (KI7MT, 2026-10-29). CI runs the fast suites and
          # the window and package ones; the rest run before a sign-off
          # (make verify), so the line says CI's checks, and no more.
          ci_run=""
          if [[ "${CI_RUN:-}" =~ ^[0-9]+$ ]]; then ci_run="https://github.com/${REPO}/actions/runs/${CI_RUN}"; fi
          {
            # Quick downloads first: the file for each computer (after WSJT-X's pages).
            node scripts/release.mjs downloads "$VERSION" release
            echo
            echo "---"
            echo
            node scripts/release.mjs notes "$VERSION"
            echo
            echo "---"
            echo
            if [ -n "$ci_run" ]; then
              echo "**Tested:** CI's checks passed on Windows, Linux x64, Linux arm64 and macOS, in [the build these files came from](${ci_run})."
              echo
            fi
            echo "A pre-release: the final ${VERSION}, out for testing before it is marked Latest."
            echo "Signed by KI7MT: Windows as **Gregory Beam**, macOS as **Greg Beam** (Apple Developer ID) and notarized by Apple."
            echo
            echo "A **.zip** is the portable build: unpack it anywhere and run it, nothing to install."
            echo "Check a download against **SHA256SUMS.txt**. Every file here was built by this repository's CI, and GitHub signs that it was: \`gh attestation verify <file> -R qso-graph/qso-graph-desktop\` ([how to verify a download](https://github.com/qso-graph/qso-graph-desktop#verify-your-download))."
          } > notes.md
          if [ "$MODE" = new ]; then
            # Refuses if the tag exists, so a release is never published twice.
            (cd release && gh release create "v${VERSION}" --repo "$REPO" --prerelease --target "$BUILT" \
              --title "QSO Graph Desktop ${VERSION}" --notes-file ../notes.md -- *)
          else
            # Begun and stopped (#118): the files it lacks, and nothing replaced. A
            # file on it that is not this build's stops the run (release.mjs resume).
            mkdir -p "$RUNNER_TEMP/present"
            # A release that stopped before its first file has none: gh says
            # "no assets to download" for that, and only that is taken as empty.
            if ! gh release download "v${VERSION}" --repo "$REPO" --dir "$RUNNER_TEMP/present" 2> "$RUNNER_TEMP/download.err"; then
              grep -qx 'no assets to download' "$RUNNER_TEMP/download.err" || { cat "$RUNNER_TEMP/download.err" >&2; exit 1; }
            fi
            (cd release && sha256sum -- *) > "$RUNNER_TEMP/expected.sums"
            (cd "$RUNNER_TEMP/present" && { sha256sum -- * 2>/dev/null || true; }) > "$RUNNER_TEMP/present.sums"
            missing=$(node scripts/release.mjs resume "$RUNNER_TEMP/expected.sums" "$RUNNER_TEMP/present.sums")
            if [ -n "$missing" ]; then
              echo "Uploading what v${VERSION} lacks:"; echo "$missing"
              mapfile -t files <<< "$missing"
              (cd release && gh release upload "v${VERSION}" --repo "$REPO" -- "${files[@]}")
            else
              echo "v${VERSION} has every file already."
            fi
          fi
          gh release view "v${VERSION}" --repo "$REPO" --json tagName,isPrerelease,assets \
            -q '"\(.tagName) pre-release=\(.isPrerelease), \(.assets | length) files"'
      # Safe to repeat: closing a closed milestone changes nothing.
      - name: Close the milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MILESTONE: ${{ needs.checks.outputs.milestone }}
        run: |
          gh api -X PATCH "repos/${REPO}/milestones/${MILESTONE}" -f state=closed --jq '"milestone \(.title): \(.state)"'

  feed:
    name: update feed
    needs: [publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml
    secrets:
      LINUX_PACKAGE_SIGNING_KEY_PRIVATE: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PRIVATE }}
      LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE }}
