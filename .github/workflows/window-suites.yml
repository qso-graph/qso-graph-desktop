# SPDX-License-Identifier: GPL-3.0-only
# The suites that open a window or use the credential store, on all three
# platforms. Kept apart from CI until every platform is green, then folded in.
# GitHub-hosted runners only: this repository is public.
name: Window suites

# Started by hand until every platform is green, so work in progress does not
# leave failed runs on the branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: window-suites-${{ github.ref }}
  cancel-in-progress: true

env:
  SUITES: keychain-roundtrip,credential-editing,persona-export,electron-smoke,setup-walk,process-recovery,reference-load,adif-validation,pota-load,axe

jobs:
  window:
    name: window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Windows build tools for the FIPS module
        if: runner.os == 'Windows'
        run: choco install -y --no-progress nasm ninja
      # A display, a Secret Service, and user namespaces for Chromium's
      # sandbox, which Ubuntu 24.04 restricts by default. The sandbox stays on.
      - name: Linux display and keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb gnome-keyring dbus-x11 libsecret-tools lsof
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - run: node scripts/fetch-adif.mjs
      - run: node scripts/fetch-pota.mjs
      - name: Window suites (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; xvfb-run -a npm run verify -- --suites "$SUITES"'
      - name: Window suites (macOS, Windows)
        if: runner.os != 'Linux'
        run: npm run verify -- --suites ${{ env.SUITES }}
