# SPDX-License-Identifier: GPL-3.0-only
# https://packages.qso-graph.net, on Cloudflare R2: our signed apt and dnf repositories (#113), and the
# Windows installer at a versioned address for the Microsoft Store (#86):
#   windows/<version>/qso-graph-desktop-<version>-win-x64.exe
# Partner Center's EXE listing takes that address as its Package URL. The Store fetches the installer
# from it, needs it to be the file itself (no redirect, which GitHub's download links are), and requires
# the file at it never to change (Store policy 10.2.9): a version's file is never rewritten here.
#
# Like the update feed (feed.yml), it is worked out from the published releases every time: the
# newest Stable releases' .deb and .rpm files, signed and indexed by scripts/linux-repos.sh, and
# their Windows installers, then uploaded. Nothing is kept between runs, so the repositories can never disagree with the Releases
# page. Called by Promote, since only a Stable release is offered; run by hand to rebuild them.
#
# Signed with the release key, "QSO Graph Releases (Linux package signing key)", which KI7MT's root
# key signs (#113). The secret is checked to hold that key, by fingerprint, before anything is signed.
#
# Needs, as repository secrets: LINUX_PACKAGE_SIGNING_KEY_PRIVATE and
# LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE; and for R2, three secrets named after what Cloudflare's token
# page calls them (KI7MT, 2026-10-28): R2_ACCESS_KEY_ID (Access Key ID), R2_SECRET_ACCESS_KEY (Secret
# Access Key) and R2_ENDPOINT (the S3 endpoint, https://<account>.r2.cloudflarestorage.com), from an
# Account API token with Object Read & Write on the bucket R2_BUCKET (a repository variable) only. A run
# without them stops and says which is missing.
name: Packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

env:
  # The release key (#113): RSA 4096, to 2036-10-24, signed by KI7MT's root key
  # C177 6630 7115 78FE 9A2B  9F7F 18C0 F6B7 0DA2 F991.
  RELEASE_KEY: E4EC9751F1AA66AB2BA508EF041096B9A6EBD256
  # How many Stable releases the repositories offer: the newest, and a few to go back to.
  KEEP: 5

jobs:
  repos:
    name: apt, dnf and the Windows installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Everything it needs is set
        env:
          KEY: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PRIVATE }}
          PASSPHRASE: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          missing=0
          for name in KEY PASSPHRASE R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!name}" ] || { echo "✗ ${name} is not set" >&2; missing=$((missing + 1)); }
          done
          [ "$missing" = 0 ] || { echo "Not built: ${missing} setting(s) missing (above)." >&2; exit 1; }
          [[ $R2_BUCKET =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "✗ R2_BUCKET is not a bucket name." >&2; exit 1; }
          [[ $R2_ENDPOINT =~ ^https://[0-9a-f]{32}(\.[a-z]{2,4})?\.r2\.cloudflarestorage\.com/?$ ]] || { echo "✗ R2_ENDPOINT is not an R2 S3 endpoint (https://<account>.r2.cloudflarestorage.com)." >&2; exit 1; }
          echo "✓ the signing key and R2 are set"
      - name: The tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm createrepo-c apt-utils gnupg >/dev/null
      - name: The newest Stable releases' Linux packages and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          gh release list --repo "$REPO" --limit 200 --json tagName,isPrerelease,isDraft,publishedAt \
            --jq "[.[] | select(.isPrerelease == false and .isDraft == false)] | sort_by(.publishedAt) | reverse | .[:${KEEP}] | .[].tagName" \
            > "$RUNNER_TEMP/tags"
          [ -s "$RUNNER_TEMP/tags" ] || { echo "No Stable release to offer." >&2; exit 1; }
          while read -r tag; do
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $tag" >&2; exit 1; }
            version=${tag#v}
            gh release download "$tag" --repo "$REPO" --dir "$RUNNER_TEMP/packages" \
              --pattern 'qso-graph-desktop-*-linux-*.deb' --pattern 'qso-graph-desktop-*-linux-*.rpm'
            mkdir -p "$RUNNER_TEMP/windows/$version"
            gh release download "$tag" --repo "$REPO" --dir "$RUNNER_TEMP/windows/$version" \
              --pattern "qso-graph-desktop-${version}-win-x64.exe"
            # Each file as the release lists it in its SHA256SUMS.txt.
            gh release download "$tag" --repo "$REPO" --pattern SHA256SUMS.txt --output - > "$RUNNER_TEMP/sums"
            (cd "$RUNNER_TEMP/packages" && grep -E ' [ *]?qso-graph-desktop-[^ ]+-linux-[^ ]+\.(deb|rpm)$' "$RUNNER_TEMP/sums" \
              | grep -F -- "-${version}-linux-" | sha256sum --check --strict)
            (cd "$RUNNER_TEMP/windows/$version" && grep -E " [ *]?qso-graph-desktop-${version//./\\.}-win-x64\\.exe$" "$RUNNER_TEMP/sums" \
              | sha256sum --check --strict)
            echo "✓ $tag"
          done < "$RUNNER_TEMP/tags"
      - name: Signed and indexed
        env:
          KEY: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PRIVATE }}
          PASSPHRASE: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/passphrase" && chmod 0600 "$RUNNER_TEMP/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --quiet --import
          # The secret holds the release key, and the passphrase opens it: its
          # fingerprint, and a signature made with it, before anything is signed.
          echo "Loaded: $(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          echo test | gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --local-user "$RELEASE_KEY" --clearsign > /dev/null
          SIGNING_KEY="$RELEASE_KEY" PASSPHRASE_FILE="$RUNNER_TEMP/passphrase" \
            bash scripts/linux-repos.sh "$RUNNER_TEMP/packages" "$RUNNER_TEMP/repo"
          # The Windows installers beside them, exactly as released (CI signed them; #86).
          cp -R "$RUNNER_TEMP/windows" "$RUNNER_TEMP/repo/windows"
          rm -f "$RUNNER_TEMP/passphrase"
          rm -rf "$GNUPGHOME"
      # Packages first, then the indexes that name them, then what is no longer
      # named: an index never points at a file that is not there. A package's
      # name is unique, so it is kept long; an index changes, so briefly.
      #
      # Not `aws s3 sync --delete` (#134): on R2 it deleted files it had just
      # uploaded, where one name begins another (repomd.xml, repomd.xml.asc), and
      # promoting 0.5.0 lost a dnf repository's repomd.xml that way. The indexes
      # are copied, which compares nothing, and what is no longer named is worked
      # out as a set by scripts/stale-keys.mjs: a key that was built is never removed.
      - name: Uploaded to packages.qso-graph.net
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          s3=(aws s3 --endpoint-url "${R2_ENDPOINT%/}" --only-show-errors)
          cd "$RUNNER_TEMP/repo"
          # A version's file never changes (the Store requires it of the installer), so --size-only: a
          # file already there is never written again. No package's name begins another's.
          "${s3[@]}" sync . "s3://${R2_BUCKET}/" --size-only --exclude '*' --include '*.deb' --include '*.rpm' --include '*.exe' \
            --cache-control 'public, max-age=31536000, immutable'
          "${s3[@]}" cp . "s3://${R2_BUCKET}/" --recursive --exclude '*.deb' --exclude '*.rpm' --exclude '*.exe' \
            --cache-control 'public, max-age=300'
          find . -type f -printf '%P\n' > "$RUNNER_TEMP/built-keys"
          aws s3api list-objects-v2 --endpoint-url "${R2_ENDPOINT%/}" --bucket "$R2_BUCKET" --output json \
            | jq -r '.Contents[]?.Key' > "$RUNNER_TEMP/served-keys"
          node "$GITHUB_WORKSPACE/scripts/stale-keys.mjs" "$RUNNER_TEMP/built-keys" "$RUNNER_TEMP/served-keys" > "$RUNNER_TEMP/stale-keys"
          while IFS= read -r key; do
            "${s3[@]}" rm "s3://${R2_BUCKET}/${key}"
            echo "removed ${key}"
          done < "$RUNNER_TEMP/stale-keys"
          echo "$(wc -l < "$RUNNER_TEMP/built-keys") file(s) built, $(wc -l < "$RUNNER_TEMP/stale-keys") no longer named and removed"
      - name: Served as built
        run: |
          set -euo pipefail
          # Every file the build made, from the public address (#134): it checked four, so a run that
          # lost aarch64's repomd.xml passed. Each index against what was built; each package and
          # installer is there (its name is unique and it is never rewritten).
          cd "$RUNNER_TEMP/repo"
          checked=0
          while IFS= read -r path; do
            url="https://packages.qso-graph.net/${path}?run=${GITHUB_RUN_ID}"
            case "$path" in
              *.deb|*.rpm|*.exe)
                curl -fsSI --retry 3 -o /dev/null "$url" || { echo "✗ ${path} is not served" >&2; exit 1; } ;;
              *)
                served=$(curl -fsS --retry 3 "$url" | sha256sum | cut -d' ' -f1) || { echo "✗ ${path} is not served" >&2; exit 1; }
                [ "$served" = "$(sha256sum < "$path" | cut -d' ' -f1)" ] || { echo "✗ ${path} is not what was built" >&2; exit 1; }
                echo "✓ ${path}" ;;
            esac
            checked=$((checked + 1))
          done < <(find . -type f -printf '%P\n' | LC_ALL=C sort)
          echo "✓ all ${checked} file(s) served as built"
          # The newest Stable Windows installer, as the Store will fetch it: the file itself, no redirect.
          version=$(head -1 "$RUNNER_TEMP/tags"); version=${version#v}
          path="windows/${version}/qso-graph-desktop-${version}-win-x64.exe"
          url="https://packages.qso-graph.net/${path}"
          code=$(curl -sS -o "$RUNNER_TEMP/served.exe" -w '%{http_code}' --max-redirs 0 "$url")
          [ "$code" = 200 ] || { echo "✗ ${url} answered ${code}, not the file" >&2; exit 1; }
          [ "$(sha256sum < "$RUNNER_TEMP/served.exe" | cut -d' ' -f1)" = "$(sha256sum < "$RUNNER_TEMP/repo/${path}" | cut -d' ' -f1)" ] \
            || { echo "✗ ${path} is not what was released" >&2; exit 1; }
          echo "✓ ${path}"
          {
            echo "### Microsoft Store (Partner Center, Packages)"
            echo
            echo "Package URL for ${version}: \`${url}\`"
            echo "Installer parameters: \`/S\` · Architecture: x64 · Language: en-us"
          } >> "$GITHUB_STEP_SUMMARY"
