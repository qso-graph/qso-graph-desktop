# SPDX-License-Identifier: GPL-3.0-only
# The update feed, https://updates.qso-graph.io/desktop.json (QGD-FRM-0019,
# docs/RELEASES.md), published from this repository's own GitHub Pages (#94),
# so no other repository and no stored credential is involved.
#
# It is worked out from the published releases every time: Stable is the
# release GitHub marks Latest, Early the newest release of either kind, and
# each names its files and their SHA-256 from that release's own
# SHA256SUMS.txt (scripts/release.mjs tracks and feed). Nothing is kept
# between runs and nothing is edited by hand, so the feed can never disagree
# with the Releases page. Called by Release and Promote; run by hand to
# rebuild it.
name: Update feed

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    name: update feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GitHub Pages: the deployment, and GitHub's token that proves it is
      # this repository's.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://updates.qso-graph.io/desktop.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The feed, from the releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/feed"
          mkdir -p "$work" site
          gh release list --repo "$REPO" --limit 200 --json tagName,isPrerelease,isLatest,isDraft > "$work/releases.json"
          node scripts/release.mjs tracks "$work/releases.json" | tee "$work/tracks"
          stable=$(sed -n 's/^stable=//p' "$work/tracks")
          early=$(sed -n 's/^early=//p' "$work/tracks")
          if [ -z "$early" ]; then echo "No release is published: there is no feed to write." >&2; exit 1; fi
          for track in stable early; do
            version=${!track}
            [ -n "$version" ] || continue
            mkdir -p "$work/$version"
            [ -f "$work/$version/SHA256SUMS.txt" ] || gh release download "v${version}" --repo "$REPO" --pattern SHA256SUMS.txt --dir "$work/$version"
            node scripts/release.mjs feed "$track" "$version" "$work/$version/SHA256SUMS.txt" site/desktop.json
          done
          touch site/.nojekyll
          cat site/desktop.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
