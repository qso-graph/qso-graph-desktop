# SPDX-License-Identifier: GPL-3.0-only
# The update feed, https://updates.qso-graph.io/desktop.json (QGD-FRM-0019,
# docs/RELEASES.md), published from this repository's own GitHub Pages (#94),
# so no other repository and no stored credential is involved.
#
# It is worked out from the published releases every time: Stable is the
# release GitHub marks Latest, Early the newest release of either kind, and
# each names its files and their SHA-256 from that release's own
# SHA256SUMS.txt (scripts/release.mjs tracks and feed). Nothing is kept
# between runs and nothing is edited by hand, so the feed can never disagree
# with the Releases page. Called by Release, Promote and the Preview; run by hand to
# rebuild it.
name: Update feed

on:
  workflow_call:
    # The release key signs the feed (#128): the copies that read it believe it
    # only with that signature. Passed by name by each caller, never inherited
    # whole, so this workflow holds the one key it uses and nothing else.
    secrets:
      LINUX_PACKAGE_SIGNING_KEY_PRIVATE:
        required: true
      LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    name: update feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GitHub Pages: the deployment, and GitHub's token that proves it is
      # this repository's.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://updates.qso-graph.io/desktop.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The feed, from the releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/feed"
          mkdir -p "$work" site
          gh release list --repo "$REPO" --limit 200 --json tagName,isPrerelease,isLatest,isDraft,publishedAt > "$work/releases.json"
          node scripts/release.mjs tracks "$work/releases.json" | tee "$work/tracks"
          stable=$(sed -n 's/^stable=//p' "$work/tracks")
          early=$(sed -n 's/^early=//p' "$work/tracks")
          # Nothing published, or every release withdrawn: a feed that offers
          # nothing, so a withdrawn release stops being offered (Codex, #94).
          [ -n "$early" ] || echo '{"format":"qso-graph-desktop-updates","version":1,"stable":null,"early":null}' > site/desktop.json
          for track in stable early; do
            version=${!track}
            [ -n "$version" ] || continue
            mkdir -p "$work/$version"
            [ -f "$work/$version/SHA256SUMS.txt" ] || gh release download "v${version}" --repo "$REPO" --pattern SHA256SUMS.txt --dir "$work/$version"
            node scripts/release.mjs feed "$track" "$version" "$work/$version/SHA256SUMS.txt" site/desktop.json
          done
          # The list Choose a version… offers (#77): the last Stable releases,
          # the newest Early and the Preview, each with its date and files.
          # Read by 0.3.0 and later; an older copy reads only the tracks.
          node scripts/release.mjs listed "$work/releases.json" | tee "$work/listed"
          while read -r track tag date; do
            mkdir -p "$work/$tag"
            [ -f "$work/$tag/SHA256SUMS.txt" ] || gh release download "$tag" --repo "$REPO" --pattern SHA256SUMS.txt --dir "$work/$tag"
            node scripts/release.mjs list "$track" "$tag" "$date" "$work/$tag/SHA256SUMS.txt" site/desktop.json
          done < "$work/listed"
          touch site/.nojekyll
          cat site/desktop.json
      # Signed with the release key, as desktop.json.asc beside it (#128). The
      # key's fingerprint comes from data/update-sources.json, the register the
      # application builds in, so what CI signs with and what a copy checks
      # against are one fact in one place; the signature is verified, by that
      # fingerprint, before anything is published.
      - name: The feed, signed
        env:
          KEY: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PRIVATE }}
          PASSPHRASE: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "${KEY:-}" ] && [ -n "${PASSPHRASE:-}" ] || { echo "✗ the release key's secrets are not set: the feed would be unsigned" >&2; exit 1; }
          fpr=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/update-sources.json","utf8")).feedKey.fingerprint)')
          [[ $fpr =~ ^[0-9A-F]{40}$ ]] || { echo "✗ the register names no release key fingerprint" >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/passphrase" && chmod 0600 "$RUNNER_TEMP/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --local-user "$fpr" --digest-algo SHA512 --armor --detach-sign \
            --output site/desktop.json.asc site/desktop.json
          rm -f "$RUNNER_TEMP/passphrase"
          # Good, and by that key: the VALIDSIG line names the signer's fingerprint.
          gpg --batch --status-fd 1 --verify site/desktop.json.asc site/desktop.json 2>/dev/null \
            | awk -v want="$fpr" '$2 == "VALIDSIG" && $3 == want { ok = 1 } END { exit !ok }' \
            || { echo "✗ the feed's signature does not verify as $fpr" >&2; exit 1; }
          echo "✓ desktop.json signed by $fpr"
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
