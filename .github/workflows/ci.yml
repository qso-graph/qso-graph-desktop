# SPDX-License-Identifier: GPL-3.0-only
# On all three platforms: the development pass (make check), then the suites
# that open a window or use the credential store.
# GitHub-hosted runners only: this repository is public, and a self-hosted
# runner on a public repository runs code from any fork's pull request.
name: CI

on:
  # Every change starts a run, documentation included, so the one required
  # check ("ci-all-green", at the end, the name every qso-graph repo uses;
  # #102) always reports (#95). The plan decides what
  # a change needs: a documentation-only change runs the citation check alone,
  # in about a minute, and builds nothing (KI7MT, 2026-10-24: "I am not going
  # through this build process for docs and readme updates").
  # main is the one working branch (docs/RELEASES.md, #94): a milestone's
  # branch reaches it by a pull request, and merging builds, tests and signs
  # but publishes nothing. Publishing is the Release workflow, release.yml.
  # A released version's fix branch, x.y.x (0.2.x), is built the same way.
  push:
    branches: [main, '[0-9]*.[0-9]*.x']
  pull_request:
    branches: [main, '[0-9]*.[0-9]*.x']
  # Nightly (KI7MT, 2026-10-24): the Preview, a signed build of main, on a
  # night main has changed. GitHub runs a schedule from the default branch.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      mac_only:
        description: 'Only the macOS package: sign, notarize and launch it, without the test suites (about 20 minutes). Publishes nothing.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event too, so a macOS-only run by hand never cancels a push's run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Never on main: a release half published is worse than one that waits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The newest glibc the Linux credential core may need (scripts/build-native.mjs).
  QG_GLIBC_MAX: '2.28'
  SUITES: keychain-roundtrip,credential-editing,callsign-export,electron-smoke,home-pages,stations,setup-walk,process-recovery,reference-load,adif-validation,pota-load,axe

jobs:
  # What this run is for, decided once:
  #   ref       what to build: main at night, a pull request's own branch,
  #             else what was pushed
  #   sign      sign the builds: main, nightly, by hand on main, and a
  #             milestone's or a fix's pull request
  #   preview   publish the Preview: nightly, or a full run by hand on main
  #   run       false when a night finds main already the Preview or released
  #   pr        the pull request a validation build is for (#92)
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      sign: ${{ steps.plan.outputs.sign }}
      preview: ${{ steps.plan.outputs.preview }}
      run: ${{ steps.plan.outputs.run }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
      pr: ${{ steps.plan.outputs.pr }}
    # Reading which files a pull request changed needs to read the pull request.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Documentation only (scripts/docs-only.mjs, which says what counts).
      # A push that opens a branch, a night's run and a run by hand are never
      # documentation-only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/docs-only.mjs
          sparse-checkout-cone-mode: false
      - id: docs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The files one push changed, from the commit before it to its own.
          compared() {
            gh api "repos/${REPO}/compare/$1...$2" > "$RUNNER_TEMP/compare.json" || return 0
            [ "$(jq '.files | length' "$RUNNER_TEMP/compare.json")" -lt 300 ] \
              && jq -r '.files[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/compare.json"
            return 0
          }
          # Whether the commit before this push passed ci-all-green: only then
          # may a documentation-only push skip the build, so a red pull request
          # cannot turn green on a change to a Markdown file (#101).
          green() {
            [ "$(gh api "repos/${REPO}/commits/$1/check-runs?check_name=ci-all-green&per_page=100" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)" -ge 1 ]
          }
          # GitHub lists at most 3,000 files of a pull request and 300 of a
          # comparison; a list that may be partial is never documentation-only
          # (found by Codex, #94), so an empty one is passed on and builds all.
          files=""
          case "$EVENT" in
            pull_request)
              # A push to an open pull request is judged by what that push
              # changed (#101), not by the whole pull request: once it held
              # any code, every later push built for an hour, even a one-line
              # change to the docs. Opening or reopening it is judged whole.
              if [ "$ACTION" = synchronize ] && [ -n "$BEFORE" ]; then
                if green "$BEFORE"; then files=$(compared "$BEFORE" "$AFTER"); fi
              else
                listed=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
                count=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename' | wc -l)
                [ "$count" -eq "$(gh api "repos/${REPO}/pulls/${PR}" --jq .changed_files)" ] && files=$listed
              fi ;;
            push) if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && green "$BEFORE"; then
                    files=$(compared "$BEFORE" "$SHA"); fi ;;
          esac
          docs_only=$(printf '%s\n' "$files" | node scripts/docs-only.mjs)
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n%s\ndocumentation only: %s\n' "${files:-(none read)}" "$docs_only"
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          MAC_ONLY: ${{ inputs.mac_only }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ref=""; sha="$SHA"; sign=false; preview=false; run=true; pr=""
          case "$EVENT" in
            schedule)
              ref=main
              sha=$(git ls-remote "https://github.com/${REPO}.git" refs/heads/main | cut -f1)
              # The Preview's tag is v<next>-preview (the preview job).
              published=$(git ls-remote "https://github.com/${REPO}.git" 'refs/tags/v*-preview' | head -n1 | cut -f1)
              # A release's tag is vMAJOR.MINOR.PATCH, on the commit it built.
              released=$(git ls-remote --tags "https://github.com/${REPO}.git" \
                | awk -v sha="$sha" '$1 == sha && $2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+(\^\{\})?$/ { print $2 }' | head -n1)
              sign=true; preview=true
              if [ -n "$published" ] && [ "$published" = "$sha" ]; then run=false; echo "main is already the Preview ($sha)."; fi
              if [ -n "$released" ]; then run=false; echo "main is released as ${released#refs/tags/} ($sha)."; fi
              ;;
            workflow_dispatch)
              if [ "$REF" = refs/heads/main ]; then sign=true; fi
              if [ "$REF" = refs/heads/main ] && [ "$MAC_ONLY" != true ]; then preview=true; fi
              ;;
            # main, and a released version's fix branch: either may be what
            # the Release workflow publishes.
            push)
              if [ "$REF" = refs/heads/main ] || [[ "$REF" =~ ^refs/heads/[0-9]+\.[0-9]+\.x$ ]]; then sign=true; fi
              ;;
            # A pull request from one of our own branches is a validation
            # build (#92): the branch's own commit, not GitHub's merge of it,
            # so the version it carries names exactly the code being tested.
            # A milestone's or a fix's branch is signed; a fork's never is.
            # GitHub gives a fork's run no secrets and no token for Azure
            # either, and the Environments admit pull requests only through
            # refs/pull/*/merge, so this is the third lock, not the only one.
            pull_request)
              if [ "$HEAD_REPO" = "$REPO" ]; then
                ref="$HEAD_REF"; sha="$HEAD_SHA"; pr="$PR"
                if [[ "$HEAD_REF" =~ ^feature/[0-9]+\.[0-9]+\.[0-9]+$ || "$BASE_REF" =~ ^[0-9]+\.[0-9]+\.x$ ]]; then sign=true; fi
              fi
              ;;
          esac
          { echo "ref=$ref"; echo "sha=$sha"; echo "sign=$sign"; echo "preview=$preview"; echo "run=$run"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref=${ref:-$REF} sign=$sign preview=$preview run=$run pr=${pr:-none}"

  # Every requirement ID a Markdown file cites exists in the spec (#95). It
  # runs on every change, documentation-only ones included, because those
  # build nothing else.
  citations:
    name: citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-citations.mjs

  check:
    name: check (${{ matrix.os }})
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && needs.plan.outputs.docs_only != 'true' && !inputs.mac_only }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: Linux arm64, the Raspberry Pi 5 the core and its
        # built-in extensions must always run on.
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit the plan recorded (the night's main, or a pull
          # request's own branch), so every job tests and packages the same
          # code even if the branch moves meanwhile (#57).
          ref: ${{ needs.plan.outputs.ref != '' && needs.plan.outputs.sha || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # AWS-LC's FIPS module builds with Go and CMake.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # The arm64 image may not carry Rust; the others do. The version is rust-toolchain.toml's (#104).
      - name: Rust, where the image has none
        if: runner.os == 'Linux'
        run: command -v cargo || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
      - name: Windows build tools for the FIPS module
        if: runner.os == 'Windows'
        run: choco install -y --no-progress nasm ninja
      # make setup, spelled out: Windows runners have no make.
      # The Linux credential core, built against glibc 2.28 in a manylinux_2_28
      # container, so the packages load on Pi OS, Debian 10+, Ubuntu 20.04+ and
      # RHEL 8+, not just on a system as new as the runner. Images pinned by digest.
      - name: Credential core against glibc 2.28
        if: runner.os == 'Linux'
        # Normally 2 to 5 minutes; a stalled mirror inside the container is cut off here, not at the job's 60.
        timeout-minutes: 20
        run: |
          case "$(uname -m)" in
            x86_64) image=quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae ;;
            aarch64) image=quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 ;;
          esac
          mkdir -p .cache
          docker run --rm -v "$PWD":/w -w /w "$image" bash scripts/core-manylinux.sh .cache/libqg_callsign_core.so
          echo "QG_CALLSIGN_CORE_LIB=$PWD/.cache/libqg_callsign_core.so" >> "$GITHUB_ENV"
      - run: npm ci
      # ADIF's archive and the US county sources, kept between runs rather than
      # fetched each time. Each is pinned by SHA-256, so a cached copy is
      # checked exactly as a fresh one is (QGD-REF-0003). Before the build,
      # which turns the county sources into the data that ships (QGD-STN-0010).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/.cache
          key: sources-${{ hashFiles('data/reference-sources.json', 'data/county-sources.json') }}
      - run: node scripts/fetch-adif.mjs
      - run: node scripts/fetch-counties.mjs
      - run: npm run build
      - run: node scripts/fetch-pota.mjs
      - run: npm run check

  window:
    name: window (${{ matrix.os }})
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && needs.plan.outputs.docs_only != 'true' && !inputs.mac_only }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: Linux arm64, the Raspberry Pi 5 the core and its
        # built-in extensions must always run on.
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit the plan recorded (the night's main, or a pull
          # request's own branch), so every job tests and packages the same
          # code even if the branch moves meanwhile (#57).
          ref: ${{ needs.plan.outputs.ref != '' && needs.plan.outputs.sha || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # The arm64 image may not carry Rust; the others do. The version is rust-toolchain.toml's (#104).
      - name: Rust, where the image has none
        if: runner.os == 'Linux'
        run: command -v cargo || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
      - name: Windows build tools for the FIPS module
        if: runner.os == 'Windows'
        run: choco install -y --no-progress nasm ninja
      # A display, a Secret Service, and user namespaces for Chromium's
      # sandbox, which Ubuntu 24.04 restricts by default. The sandbox stays on.
      - name: Linux display and keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb gnome-keyring dbus-x11 libsecret-tools lsof openbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The Linux credential core, built against glibc 2.28 in a manylinux_2_28
      # container, so the packages load on Pi OS, Debian 10+, Ubuntu 20.04+ and
      # RHEL 8+, not just on a system as new as the runner. Images pinned by digest.
      - name: Credential core against glibc 2.28
        if: runner.os == 'Linux'
        # Normally 2 to 5 minutes; a stalled mirror inside the container is cut off here, not at the job's 60.
        timeout-minutes: 20
        run: |
          case "$(uname -m)" in
            x86_64) image=quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae ;;
            aarch64) image=quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 ;;
          esac
          mkdir -p .cache
          docker run --rm -v "$PWD":/w -w /w "$image" bash scripts/core-manylinux.sh .cache/libqg_callsign_core.so
          echo "QG_CALLSIGN_CORE_LIB=$PWD/.cache/libqg_callsign_core.so" >> "$GITHUB_ENV"
      - run: npm ci
      # ADIF's archive and the US county sources, kept between runs rather than
      # fetched each time. Each is pinned by SHA-256, so a cached copy is
      # checked exactly as a fresh one is (QGD-REF-0003). Before the build,
      # which turns the county sources into the data that ships (QGD-STN-0010).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/.cache
          key: sources-${{ hashFiles('data/reference-sources.json', 'data/county-sources.json') }}
      - run: node scripts/fetch-adif.mjs
      - run: node scripts/fetch-counties.mjs
      - run: npm run build
      - run: node scripts/fetch-pota.mjs
      - name: Window suites (Linux)
        if: runner.os == 'Linux'
        run: |
          # A window manager too: without one nothing minimises or raises a
          # window, and electron-smoke checks that a second launch raises it.
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; xvfb-run -a bash -c "openbox & sleep 1; npm run verify -- --suites \"\$SUITES\""'
      - name: Window suites (macOS, Windows)
        if: runner.os != 'Linux'
        run: npm run verify -- --suites ${{ env.SUITES }}
      # A failed window suite's screenshots and logs (report/), so a failure
      # can be seen rather than guessed at. Credentials in them are the
      # suites' own fakes, and logs are redacted before they are written.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: window-report-${{ runner.os }}-${{ runner.arch }}
          path: report/
          if-no-files-found: ignore
          retention-days: 7

  # The installers each platform ships (electron-builder, as Podman Desktop
  # and Bitwarden use, laid out as Oracle's WebLogic Remote Console is): a DMG
  # and a zip on macOS, an NSIS installer and a zip on Windows, an AppImage,
  # deb, rpm and zip on Linux. A zip is the portable build: unpack it and run
  # it. Kept for a week.
  #
  # Signed builds (QGD-SCP-0005), both in KI7MT's name: macOS with his Apple
  # Developer ID (Greg Beam) and notarized by Apple, Windows as Gregory Beam. Signed are main, the night's
  # build, a run by hand on main, and a validation build of a
  # milestone's or a fix's pull request (#92). The secrets are in the
  # macos-signing and windows-signing Environments; a fork's run gets none of
  # them and no token Azure accepts, whatever this file says. Everything else
  # is unsigned.
  package:
    name: package (${{ matrix.os }})
    needs: [plan, check, window]
    # After both test jobs pass; or alone, for a macOS-only run by hand.
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && (inputs.mac_only || (needs.check.result == 'success' && needs.window.result == 'success')) }}
    # The signing secrets reach only a run plan says signs, and the
    # Environment itself releases them only to main and to pull requests
    # (refs/pull/*/merge; a fork's run gets no secrets either way). Windows
    # signs as KI7MT through Azure Artifact Signing (#81): no secret at all,
    # GitHub's own token is trusted by Azure for the windows-signing
    # Environment of this repository alone.
    environment: ${{ needs.plan.outputs.sign == 'true' && (matrix.os == 'macos-latest' && 'macos-signing' || matrix.os == 'windows-latest' && 'windows-signing' || '') || '' }}
    permissions:
      contents: read
      # GitHub's token: for Azure, by the Windows signing step, and for
      # Sigstore, by the provenance step (#83).
      id-token: write
      attestations: write
    env:
      SIGN_MAC: ${{ matrix.os == 'macos-latest' && needs.plan.outputs.sign == 'true' }}
      SIGN_WIN: ${{ matrix.os == 'windows-latest' && needs.plan.outputs.sign == 'true' }}
      # electron-builder skips signing in any pull request's run unless told
      # otherwise, a guard against a fork's code signing with the project's
      # keys. A validation build (#92) is signed on purpose and only for our
      # own branches; a fork's run gets no secrets and no Azure token at all.
      CSC_FOR_PULL_REQUEST: ${{ needs.plan.outputs.pr != '' && needs.plan.outputs.sign == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: Linux arm64, the Raspberry Pi 5 the core and its
        # built-in extensions must always run on.
        os: ${{ fromJSON(inputs.mac_only && '["macos-latest"]' || '["macos-latest", "ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Two hours for a signed Mac build: Apple's notarization queue decides,
    # and a team's first submissions can take an hour. Others finish in minutes.
    timeout-minutes: ${{ fromJSON(matrix.os == 'macos-latest' && '120' || matrix.os == 'windows-latest' && '60' || '45') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit the plan recorded (the night's main, or a pull
          # request's own branch), so every job tests and packages the same
          # code even if the branch moves meanwhile (#57).
          ref: ${{ needs.plan.outputs.ref != '' && needs.plan.outputs.sha || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # The arm64 image may not carry Rust; the others do. The version is rust-toolchain.toml's (#104).
      - name: Rust, where the image has none
        if: runner.os == 'Linux'
        run: command -v cargo || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
      - name: Windows build tools for the FIPS module
        if: runner.os == 'Windows'
        run: choco install -y --no-progress nasm ninja
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm
      # The Linux credential core, built against glibc 2.28 in a manylinux_2_28
      # container, so the packages load on Pi OS, Debian 10+, Ubuntu 20.04+ and
      # RHEL 8+, not just on a system as new as the runner. Images pinned by digest.
      - name: Credential core against glibc 2.28
        if: runner.os == 'Linux'
        # Normally 2 to 5 minutes; a stalled mirror inside the container is cut off here, not at the job's 60.
        timeout-minutes: 20
        run: |
          case "$(uname -m)" in
            x86_64) image=quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae ;;
            aarch64) image=quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 ;;
          esac
          mkdir -p .cache
          docker run --rm -v "$PWD":/w -w /w "$image" bash scripts/core-manylinux.sh .cache/libqg_callsign_core.so
          echo "QG_CALLSIGN_CORE_LIB=$PWD/.cache/libqg_callsign_core.so" >> "$GITHUB_ENV"
      - run: npm ci
      # The county data ships in the package, so its sources come first
      # (QGD-STN-0010).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/.cache
          key: sources-${{ hashFiles('data/reference-sources.json', 'data/county-sources.json') }}
      - run: node scripts/fetch-adif.mjs
      - run: node scripts/fetch-counties.mjs
      # The Preview's version gains the commit's UTC date and time and the
      # commit (docs/RELEASES.md), here, never in a commit. The commit's time,
      # so all four platforms carry one version. A push to main is not
      # stamped: that build is the one the Release workflow publishes.
      - name: Preview version
        if: needs.plan.outputs.preview == 'true'
        shell: bash
        run: |
          stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M HEAD)
          commit=$(git rev-parse HEAD)
          npm pkg set version="$(node -p "require('./package.json').version")-${stamp}-${commit::11}"
          node -p "require('./package.json').version"
      # A pull request's build (#92) carries the pull request and its commit:
      # 0.2.1-pr96.c0b8250, in the title bar and About, so the issue can say
      # exactly which build it was validated on. A commit that is all digits
      # gains a g, because a version's part may not be a number with a
      # leading zero (git describe does the same).
      - name: Pull request build version
        if: needs.plan.outputs.pr != ''
        shell: bash
        env:
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          commit=$(git rev-parse --short=7 HEAD)
          if [[ "$commit" =~ ^[0-9]+$ ]]; then commit="g${commit}"; fi
          npm pkg set version="$(node -p "require('./package.json').version")-pr${PR}.${commit}"
          node -p "require('./package.json').version"
      - name: Installers
        if: env.SIGN_MAC != 'true' && env.SIGN_WIN != 'true'
        run: npm run installer
      # Windows, signed in KI7MT's name (#81). Azure is signed in to with
      # GitHub's token for this Environment, so no credential is held. The
      # three IDs only say which Azure app, directory and subscription;
      # they are kept as the Environment's secrets so they stay masked and
      # out of the public repository and its logs.
      - name: Azure sign-in for signing (Windows)
        if: env.SIGN_WIN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # electron-builder signs each executable, the native core and every DLL
      # (signExts in package.json: a list, which -c on the command line cannot
      # give; #84, found by Turing; DLLs for the Microsoft Store, #86) and the installer with Microsoft's TrustedSigning
      # module, which uses the sign-in above. The account, profile and endpoint are names, not
      # secrets; the publisher is the certificate's, as Windows shows it.
      - name: Installers, signed (Windows)
        if: env.SIGN_WIN == 'true'
        shell: bash
        run: >-
          npm run installer --
          -c.win.azureSignOptions.publisherName="Gregory Beam"
          -c.win.azureSignOptions.endpoint=https://wus2.codesigning.azure.net
          -c.win.azureSignOptions.codeSigningAccountName=qsographsigning
          -c.win.azureSignOptions.certificateProfileName=qso-graph
      # What Windows will say: the installer and every program file in the
      # application (.exe, .dll, .node) validly signed. The Microsoft Store
      # requires every PE file signed (policy 10.2.9, #86); this checked only
      # the .exe and .node files, so the unsigned DLLs Electron and the
      # credential core's crypto library ship passed it. Ours are signed by
      # Gregory Beam; a DLL Microsoft signed itself keeps Microsoft's.
      - name: Signatures (Windows)
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem out\*.exe) + @(Get-ChildItem -Recurse out\win-unpacked -Include *.exe,*.dll,*.node)
          if ($files.Count -lt 10) { throw "Expected the installer and the application's program files; found $($files.Count) file(s)." }
          $bad = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $subject = $signature.SignerCertificate.Subject
            $name = $file.FullName.Substring((Resolve-Path out).Path.Length + 1)
            Write-Output "$name`: $($signature.Status), $subject"
            if ($signature.Status -ne 'Valid') { Write-Output "::error::$name is not validly signed: $($signature.StatusMessage)"; $bad++; continue }
            $ours = $subject -match '(^|, )CN=Gregory Beam(,|$)'
            # Microsoft signs its own DLLs as "CN=Microsoft Windows, O=Microsoft Corporation, L=Redmond, …"
            # (d3dcompiler_47.dll, dxil.dll: run #131); Valid above means the chain is Windows' own.
            $microsoft = $file.Extension -eq '.dll' -and $subject -match '(^|, )O=Microsoft Corporation(,|$)' -and $subject -match '(^|, )L=Redmond(,|$)'
            if (-not ($ours -or $microsoft)) { Write-Output "::error::$name is signed by someone else: $subject"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) not signed as they must be." }
      # Signed and notarized. The secrets reach this step and no other. The
      # notarization key is written to the runner's temporary folder, which
      # is removed with the runner, because electron-builder takes a path.
      - name: Installers, signed and notarized (macOS)
        if: env.SIGN_MAC == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [ -n "${!name}" ] || { echo "The macos-signing Environment has no $name." >&2; exit 1; }
          done
          # Each secret's shape, said plainly, never its value: a key pasted
          # into the wrong secret otherwise fails later as a broken path.
          [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "APPLE_API_KEY_ID should be the 10-character Key ID (the part after AuthKey_ in the .p8's name)." >&2; exit 1; }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "APPLE_TEAM_ID should be the 10-character Team ID." >&2; exit 1; }
          [[ "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "APPLE_API_ISSUER should be the Issuer ID, a UUID." >&2; exit 1; }
          [[ "$APPLE_API_KEY_P8" == *"-----BEGIN PRIVATE KEY-----"*"-----END PRIVATE KEY-----"* ]] || { echo "APPLE_API_KEY_P8 should be the whole .p8 file, BEGIN and END lines included." >&2; exit 1; }
          # The signing keychain, made here rather than by electron-builder:
          # 26.15.3 passes the certificate's password where the keychain's
          # belongs (set-key-partition-list -k), and the unlock fails. Its
          # password is random, masked, and dies with the runner. Apple's
          # Developer ID G2 intermediate goes in beside the certificate, so
          # the identity is valid; codesign still checks the chain to
          # Apple's root, so the intermediate cannot vouch for anything else.
          keychain="$RUNNER_TEMP/qgd-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/qgd-signing.p12"
          printf '%s' "$CSC_LINK" | tr -d ' \r\n' | base64 --decode > "$p12"
          unset CSC_LINK
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          unset CSC_KEY_PASSWORD
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          unset APPLE_API_KEY_P8
          # Said as it happens: each file signed, then the notarization's
          # submission and Apple's answer, which electron-builder otherwise
          # waits on in silence.
          DEBUG='electron-osx-sign*,electron-notarize*,@electron/osx-sign*,@electron/notarize*' \
            APPLE_API_KEY="$key" npm run installer -- -c.mac.identity="Greg Beam (${APPLE_TEAM_ID})"
          rm -f "$key"
      # What Gatekeeper will say: signed by the project, notarized, and the
      # ticket stapled, so it opens offline on first launch too.
      - name: Signature and notarization (macOS)
        if: env.SIGN_MAC == 'true'
        run: |
          set -euo pipefail
          app=$(ls -d out/mac-arm64/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      # And that it runs: the signed bundle under the hardened runtime, the
      # credential core loaded and a credential saved in the Keychain. A
      # signature that is valid on an app that will not start is no release.
      - name: The signed build launches (macOS)
        if: env.SIGN_MAC == 'true'
        run: npm run verify -- --suites packaged-launch
      # Microsoft's Visual C++ runtime (#91). GitHub's runners always have it
      # and a fresh Windows 11 does not, which is how 0.2.0's credential core
      # failed for new users while every test here passed. So: every DLL our
      # native files import must be Windows's, the runtime's or shipped, and
      # the check must fail with the runtime taken off its list.
      - name: Windows imports (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/windows-imports.mjs out/win-unpacked/resources/app.asar.unpacked
          if node scripts/windows-imports.mjs out/win-unpacked/resources/app.asar.unpacked --without vcruntime140.dll; then
            echo "The import check passed with the Visual C++ runtime off its list: it checks nothing." >&2; exit 1
          fi
      # The installer's runtime step (build/vc-runtime.ps1), each answer, with
      # the Windows PowerShell the installer uses: present here, so nothing
      # to do; Microsoft's download, checked as Microsoft's; and a file signed
      # by anyone else refused. Each twice: as the installer runs it (the
      # module path cleared), and with PowerShell 7's module path inherited,
      # which broke Windows PowerShell's signature check once (#85), as it
      # would for an installer started from PowerShell 7.
      - name: Visual C++ runtime step (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $cases = @(
            @{ Args = @(); Want = 0; What = 'the runtime is present' },
            @{ Args = @('-VerifyOnly'); Want = 0; What = "Microsoft's download is signed by Microsoft" },
            @{ Args = @('-VerifyOnly', '-From', (Resolve-Path 'out/win-unpacked/QSO Graph Desktop.exe').Path); Want = 11; What = 'a file not signed by Microsoft is refused' }
          )
          $inherited = $env:PSModulePath
          foreach ($path in @($null, $inherited)) {
            $env:PSModulePath = $path
            $how = if ($path) { "PowerShell 7's module path inherited" } else { 'module path cleared' }
            foreach ($case in $cases) {
              $a = $case.Args
              & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File build/vc-runtime.ps1 @a
              if ($LASTEXITCODE -ne $case.Want) { throw "$($case.What), $($how): exit $LASTEXITCODE, wanted $($case.Want)" }
              Write-Output "OK: $($case.What), $how"
            }
          }
          # The last case's 11 is the answer wanted, but GitHub's PowerShell
          # step ends with the last exit code it saw, so say so explicitly.
          exit 0
      # Installed as an operator installs it, silently here, so the installer's
      # own steps run, then launched and driven: the credential core must
      # answer (#91; the Mac's signed build has the same suite).
      - name: The installed build launches (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem out -Filter 'qso-graph-desktop-*-win-x64.exe' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'qgd-installed'
          $run = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The installer exited $($run.ExitCode)." }
          $env:QG_PACKAGED_APP = Join-Path $target 'QSO Graph Desktop.exe'
          if (-not (Test-Path -LiteralPath $env:QG_PACKAGED_APP)) { throw "The installer did not put the application in $target." }
          npm run verify -- --suites packaged-launch
      # A failed launch's screenshot and the application's logs (report/), as
      # the window jobs keep theirs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os == 'Windows'
        with:
          name: packaged-launch-report-windows
          path: report/
          if-no-files-found: ignore
          retention-days: 7
      # What shipped: the built-in extensions and the host are in it, and no
      # development material is (QGD-APP-0017).
      - run: npm run verify -- --suites package-contents
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qso-graph-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/*.dmg
            out/*.exe
            out/*.AppImage
            out/*.deb
            out/*.rpm
            out/*.zip
          if-no-files-found: error
          # main's build is the one a release publishes, so it is kept long
          # enough to wait for the Release button (#94).
          retention-days: ${{ github.event_name == 'push' && needs.plan.outputs.sign == 'true' && 90 || 7 }}
      # Build provenance (#83): GitHub signs, in Sigstore's public transparency
      # log, that each installer was built by this workflow in this repository
      # from this commit. Nobody can make one for this repository, a fork
      # included, so it is what tells an official download from any other
      # (gh attestation verify <file> -R qso-graph/qso-graph-desktop). Only for
      # the builds that may be published: main, the night's Preview, a fix
      # branch; never a pull request's.
      - name: Provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/*.dmg
            out/*.exe
            out/*.AppImage
            out/*.deb
            out/*.rpm
            out/*.zip

  # The installers of a pull request's build (#92), each its own download,
  # not zipped, under its own file name, and one comment on the pull request
  # that links them, edited in place on every new build. The links need a
  # GitHub sign-in, as every run's files do, and last 14 days.
  pr-build:
    name: pull request build
    needs: [plan, package]
    if: ${{ !cancelled() && needs.plan.outputs.pr != '' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qso-graph-desktop-*
          path: build
          merge-multiple: true
      - run: ls -la build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-win-x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-mac-arm64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-linux-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-linux-amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-linux-x86_64.rpm
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-linux-arm64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-linux-arm64.deb
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/qso-graph-desktop-*-linux-aarch64.rpm
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: The comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          PR: ${{ needs.plan.outputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          SIGNED: ${{ needs.plan.outputs.sign }}
        run: |
          set -euo pipefail
          version=$(ls build/qso-graph-desktop-*-linux-x86_64.AppImage | sed -E 's|^build/qso-graph-desktop-(.*)-linux-x86_64\.AppImage$|\1|')
          link() {
            gh api "repos/${REPO}/actions/runs/${RUN}/artifacts" --paginate \
              --jq ".artifacts[] | select(.name == \"qso-graph-desktop-${version}-$1\") | \"[\(.name)](https://github.com/${REPO}/actions/runs/${RUN}/artifacts/\(.id))\""
          }
          marker='<!-- qgd-pull-request-build -->'
          {
            echo "$marker"
            echo "**Build \`${version}\`**, of ${SHA}. About and the title bar show this version."
            echo
            echo "- **Windows:** $(link win-x64.exe)"
            echo "- **macOS:** $(link mac-arm64.dmg)"
            echo "- **Linux x86-64:** $(link linux-x86_64.AppImage) · $(link linux-amd64.deb) · $(link linux-x86_64.rpm)"
            echo "- **Linux arm64:** $(link linux-arm64.AppImage) · $(link linux-arm64.deb) · $(link linux-aarch64.rpm)"
            echo
            if [ "$SIGNED" = true ]; then
              echo "Signed by KI7MT: Windows as **Gregory Beam**, macOS as **Greg Beam** (Apple Developer ID) and notarized by Apple. Each certificate shows the name as Microsoft or Apple verified it."
            else
              echo "Not signed: only a milestone's or a fix's branch is."
            fi
            echo "The links need a GitHub sign-in and last 14 days. This build never updates itself."
            echo
            echo "An issue fixed here is validated on this build, and says so: **validated on \`${version}\`**."
          } > comment.md
          cat comment.md
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@comment.md --jq .html_url
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md --jq .html_url
          fi

  # The Preview pre-release (docs/RELEASES.md): the night's green build of main,
  # every installer its own download on the Releases page, replacing the one
  # before, files, tag and all (KI7MT, 2026-10-23: an artifact is zipped by
  # GitHub and buried in a run, where nobody finds it). This repository's own
  # token, so no other credential is held here.
  preview:
    name: preview release
    # Not past a failed dependency audit (#102; found by Codex): the Preview is
    # published, so it waits for the audit as Release waits for ci-all-green.
    needs: [plan, package, audit]
    if: ${{ !cancelled() && needs.plan.outputs.preview == 'true' && needs.package.result == 'success' && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # The installers' provenance, and attesting the SHA256SUMS.txt made here.
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qso-graph-desktop-*
          path: preview
          merge-multiple: true
      # Every file has this repository's CI provenance before it is put up (#83).
      - name: Provenance verifies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for file in preview/*; do
            gh attestation verify "$file" -R "$REPO" --signer-workflow "${REPO}/.github/workflows/ci.yml" >/dev/null
            echo "✓ $(basename "$file")"
          done
      - name: SHA256SUMS.txt
        run: (cd preview && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # Made here, so its provenance is this job's (found by Codex, #83).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: preview/SHA256SUMS.txt
      - name: Replace the Preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          cd preview
          ls -la
          version=$(ls qso-graph-desktop-*-linux-x86_64.AppImage | sed -E 's/^qso-graph-desktop-(.*)-linux-x86_64\.AppImage$/\1/')
          # The release it previews: 0.2.0 from 0.2.0-202610242217-5b9f1d97905.
          next=${version%%-*}
          # Tagged v<next>-preview, so GitHub's Releases page, which sorts by
          # version and puts a tag that is not one last, shows it at the top,
          # above every released version and below <next> once that is out
          # (KI7MT, 2026-10-24: "they are not visible on my screen").
          tag="v${next}-preview"
          {
            echo "**A preview of ${next}**, built from main at ${SHA} (version ${version})."
            echo
            echo "For testing what is coming, not for running your station (docs/RELEASES.md). Rebuilt each night main has changed."
            echo
            echo "- **Windows:** signed by Gregory Beam (KI7MT). The signature is new, so Edge may say the file isn't commonly downloaded (**Keep**), and Windows may say it protected your PC: **More info** shows the publisher, then **Run anyway**."
            echo "- **macOS:** signed by Greg Beam (KI7MT) with an Apple Developer ID, and notarized by Apple."
            echo "- A **.zip** is the portable build: unpack it anywhere and run it."
            echo
            echo "Check a download against **SHA256SUMS.txt**."
          } > ../notes.md
          # One Preview at a time: the one before, under its old tag or the
          # plain `preview` it used to have, goes first, tag and all.
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^(preview|v[0-9]+\.[0-9]+\.[0-9]+-preview)$' \
            | while read -r old; do gh release delete "$old" --repo "$REPO" --cleanup-tag --yes; done
          gh release create "$tag" --repo "$REPO" --prerelease --target "$SHA" \
            --title "Preview of ${next}" --notes-file ../notes.md -- *

  # The feed lists the Preview (#77), for those who tick Show previews, so a
  # new one is in it the night it is published.
  preview-feed:
    name: update feed
    needs: [preview]
    if: ${{ !cancelled() && needs.preview.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml

  # The dependencies' own security (#102): npm's advisories at high and above,
  # and RustSec's for the credential core, against the locked versions. On every
  # build, and every night even when main has not changed (the plan skips the
  # rest then), because a new advisory arrives from outside the repository.
  # Reads the lockfiles only, so it installs nothing and takes a minute or two.
  audit:
    name: dependency audit
    needs: [plan]
    if: ${{ needs.plan.outputs.docs_only != 'true' && !inputs.mac_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.ref != '' && needs.plan.outputs.sha || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: npm audit
        run: npm audit --audit-level=high
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --file packages/callsign-core/Cargo.lock

  # All green (#95): the one check the repository's rules require before a
  # merge. It always reports, documentation-only changes included: the plan
  # and the citation check must pass, and so must every build job the plan
  # asked for, the validation build's links included (#92). A job the plan
  # skipped (documentation only, a night with nothing new, a macOS-only run's
  # other platforms, a fork's pull request's links) is not a failure; a job
  # that failed or was cancelled is.
  all-green:
    # The org-wide name for the one required check (#102): every qso-graph
    # repo rolls its jobs up into a check called exactly ci-all-green.
    name: ci-all-green
    needs: [plan, citations, check, window, package, pr-build, audit]
    # Not for a macOS-only run by hand: it skips the test suites, so its
    # ci-all-green would vouch for a commit nothing tested, and a later
    # documentation-only push would trust it (found by Codex, #101).
    if: ${{ always() && !inputs.mac_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          for must in plan citations; do
            [ "$(printf '%s' "$NEEDS" | jq -r --arg j "$must" '.[$j].result')" = success ] || bad="$bad $must"
          done
          if [ -n "${bad// /}" ]; then echo "Not green: $bad" >&2; exit 1; fi
          echo "All green."
