# Dependabot: security updates only, grouped (#102), as every qso-graph MCP repo has it.
#
# Without this file Dependabot opens one pull request per advisory per package,
# which across the MCP fleet came to 57 pull requests for four upgrades. Grouped,
# it is one pull request per ecosystem. `open-pull-requests-limit: 0` turns off
# *version* updates only; security updates have their own fixed limit and are
# unaffected. CI's dependency audit (npm and RustSec) checks the locks on every
# build and every night, so a stale lock is caught without a bot.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/packages/callsign-core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/packages/integrations-core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
